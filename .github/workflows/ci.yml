name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # 项目在 Windows 上开发与验证（better-sqlite3 预编译产物、路径/重试语义测试均按 Windows 断言）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 以 Node runtime 安装 better-sqlite3 预编译产物，单元测试直接可用
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
