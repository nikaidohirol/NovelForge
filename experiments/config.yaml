# 对比实验配置（聚焦点 A + C）
# 文档标准设计为 5 次重复 × 50 轮 × 3 策略；默认给预算友好的冒烟参数，
# 正式实验时改回 repeats: 5 / turns: 50 即可。
strategies: [threshold, rate_based, periodic]
repeats: 2
turns: 12
base_seed: 42
judge_enabled: true   # LLM-as-Judge 角色一致性打分（便宜模型档）
characters: []        # 空 = 使用 data/characters 全部角色
scenario: cafe_meeting
